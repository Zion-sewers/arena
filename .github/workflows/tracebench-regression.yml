name: Tracebench regression

# Scheduled regression runner for trace-mined benchmarks (arena#41).
# Mines the checked-in SAMPLE corpus on a weekly cadence (the cadence the
# sample benchmark declares) and gates a candidate against the frozen
# version it publishes. The loop is closed across runs: the snapshot store
# and the run state (previous version + consecutive-failure streak) are
# restored from the actions cache, so versions chain, changed oracles
# publish as updates, vanished patterns retire, and the rollback arm is
# reachable on the 3rd consecutive failure with no operator hand-feeding.
#
# The candidate: by default the run regresses the oracle outputs mined in
# the same run — a smoke test proving the runner executes and the frozen
# benchmark gates, not a regression of a real agent. A real regression
# supplies a candidate: dispatch this workflow with `candidate-artifact`
# set to an uploaded artifact holding candidate-outputs.json (a JSON
# object mapping case_id -> output string), and the schedule gates THAT
# candidate against the frozen benchmark instead. The sample corpus is
# recorded-format fixtures, not real incidents; a production deployment
# points --corpus at its real trace export.
#
# Rollback wiring: the runner reads the streak from tracebench-state/
# (written back every run); at 2 prior failures a failing run also
# dispatches rollback (proven by tests/test_tracebench.py, which
# simulates three consecutive failing weeks through the real state file).

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      candidate-artifact:
        description: "Artifact holding candidate-outputs.json (case_id -> output). Empty runs the oracle smoke test."
        required: false
        default: ""
        type: string

jobs:
  regress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Restore tracebench store + run state
        uses: actions/cache@v4
        with:
          path: |
            tracebench-store
            tracebench-state
          key: tracebench-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            tracebench-${{ github.ref_name }}-
      - name: Download candidate outputs (when supplied)
        if: inputs.candidate-artifact != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.candidate-artifact }}
          path: candidate-out
      - name: Select candidate outputs
        id: candidate
        run: |
          if [ -n "${{ inputs.candidate-artifact }}" ]; then
            echo "path=candidate-out/candidate-outputs.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=tracebench-out/oracle-outputs.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Mine sample corpus + regress candidate
        run: |
          agenteval-bench tracebench mine --corpus examples/traces/production-traces.sample.jsonl --owner arena-maintainers --cadence weekly --out tracebench-out
          agenteval-bench tracebench regress --corpus examples/traces/production-traces.sample.jsonl --store tracebench-store --suite tracebench-sample --candidate-outputs ${{ steps.candidate.outputs.path }} --owner arena-maintainers --cadence weekly --state-dir tracebench-state --out tracebench-out/regress
      - name: Upload tracebench run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracebench-regression
          path: tracebench-out/
