name: Tracebench regression

# Scheduled regression runner for trace-mined benchmarks (arena#41).
# Mines the checked-in SAMPLE corpus on a weekly cadence (the cadence the
# sample benchmark declares) and gates the oracle candidate against the
# frozen version it publishes. The sample corpus is recorded-format
# fixtures, not real incidents — this workflow proves the runner on
# schedule, it does not claim real mining. A production deployment points
# --corpus at its real trace export, persists the store across runs, and
# chains --prev with a date-based --version so newly mined cases extend
# the benchmark instead of re-publishing version 1.
#
# Rollback wiring: this workflow passes no --prior-failures (default 0),
# so a failing run dispatches gate + investigation. An operator tracking
# the streak feeds the previous run's consecutive-failures count via
# --prior-failures; at 2 prior failures the run also dispatches rollback
# (proven by the demo and tests/test_tracebench.py).

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  regress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Mine sample corpus + regress oracle candidate
        run: |
          agenteval-bench tracebench mine --corpus examples/traces/production-traces.sample.jsonl --owner arena-maintainers --cadence weekly --out tracebench-out
          agenteval-bench tracebench regress --corpus examples/traces/production-traces.sample.jsonl --store tracebench-store --suite tracebench-sample --version 1 --candidate-outputs tracebench-out/oracle-outputs.json --owner arena-maintainers --cadence weekly --out tracebench-out/regress
      - name: Upload tracebench run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracebench-regression
          path: tracebench-out/
