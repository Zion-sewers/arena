name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Lint
        run: ruff check src/ tests/
      - name: Tiered pipeline (gate -> smoke -> expanded)
        run: agenteval-bench tiered --phase expanded
      - name: Experiment-discipline demo (violations must fail)
        run: PYTHONPATH=src python -m experiment.demo
      - name: Simpson-safe aggregation demo (reversal must be refused)
        run: PYTHONPATH=src python -m experiment.demo_simpson
      - name: SWE-smith bug-injection demo (bug-gen -> Docker validation -> curation)
        run: PYTHONPATH=src python -m bugsmith.demo
