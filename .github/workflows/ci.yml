name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Lint
        run: ruff check src/ tests/
      - name: Tiered pipeline (gate -> smoke -> expanded)
        run: agenteval-bench tiered --phase expanded --out tiered-expanded-report.json
      - name: Upload expanded report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiered-expanded-report
          path: tiered-expanded-report.json
      - name: Experiment-discipline demo (violations must fail)
        run: PYTHONPATH=src python -m experiment.demo
      - name: Simpson-safe aggregation demo (reversal must be refused)
        run: PYTHONPATH=src python -m experiment.demo_simpson
      - name: SWE-smith bug-injection demo (bug-gen -> Docker validation -> curation)
        run: PYTHONPATH=src python -m bugsmith.demo
      - name: Fix-commit flywheel demo (Detect -> Sample -> Reflect -> Propose -> Validate -> PR)
        run: PYTHONPATH=src python -m flywheel.demo < /dev/null
      - name: Trace-mined benchmark demo (mine -> publish -> gate -> rollback)
        run: PYTHONPATH=src python -m agenteval_bench.tracebench_demo < /dev/null
      - name: Decision-system demo (evidence -> uncertainty -> threshold -> action)
        run: PYTHONPATH=src python -m agenteval_bench.decision_demo
      - name: Measurement-validity demo (every metric carries a reliability column)
        run: PYTHONPATH=src python -m agenteval_bench.validity_demo
      - name: Judge-decorrelation demo (HOST != FAMILY; holes reported, never dropped)
        run: PYTHONPATH=src python -m agenteval_bench.judges_demo
      - name: Judge-calibration demo (confidence is not evidence; only CALIBRATED gates)
        run: PYTHONPATH=src python -m agenteval_bench.calibration_demo
      - name: OEC ship-gate demo (OEC + guardrails + trust gates; surprising wins need replication)
        run: PYTHONPATH=src python -m experiment.demo_oec
