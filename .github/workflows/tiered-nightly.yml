name: Tiered nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Tiered pipeline (gate -> smoke -> expanded -> nightly)
        run: agenteval-bench tiered --phase nightly --mutants 8 --out tiered-nightly-report.json
      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiered-nightly-report
          path: tiered-nightly-report.json
